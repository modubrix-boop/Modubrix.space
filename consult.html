<main>
  <h1 data-zh="Consult · 我们如何协助你做决定"
      data-en="Consult · How We Help You Decide"></h1>

  <p data-zh="内装项目里，真正困难的往往不是“能不能做”，而是“要不要做、什么时候做、值不值得做”。"
     data-en="In interior projects, the challenge is rarely feasibility, but whether something should be done, when to do it, and whether it is worth it."></p>

  <p data-zh="我们的角色不是替你做决定，而是在每一个关键节点陪你把事情想清楚。"
     data-en="Our role is not to decide for you, but to think through key decisions with you at critical points."></p>

  <h2 data-zh="我们通常会一起判断这些问题"
      data-en="We Commonly Evaluate Questions Like These"></h2>

  <p data-zh="• 这个部分是否真的需要定制？还是现成方案就足够？"
     data-en="• Does this part truly need to be custom, or is a standard solution sufficient?"></p>

  <p data-zh="• 预算该优先花在“每天会用到”的地方，还是视觉效果？"
     data-en="• Should the budget go to daily usability, or primarily to visual impact?"></p>

  <p data-zh="• 这个材料现在好看，但日后是否好维护、好清洁？"
     data-en="• This material looks good now—will it be practical to clean and maintain later?"></p>

  <p data-zh="• 这个设计在现实生活中，会不会造成不便或空间拥挤？"
     data-en="• Will this design choice create inconvenience or clutter in real daily use?"></p>

  <p data-zh="• 有些东西是否可以先不做，住进去后再决定？"
     data-en="• Are there parts better left for later, after living in the space for a while?"></p>

  <div class="note"
       data-zh="有时候，我们最重要的工作不是推动进度，而是踩刹车：让决定更清楚、让结果更踏实。"
       data-en="Sometimes our most valuable work is slowing things down—so decisions are clearer and outcomes feel truly solid."></div>

  <h2 data-zh="我们的沟通方式"
      data-en="How We Communicate"></h2>

  <p data-zh="我们不会用很多复杂的专业名词，也不会让你在一堆选项里迷路。我们更习惯把问题讲清楚：哪一个更适合、为什么适合、未来会遇到什么。"
     data-en="We avoid unnecessary jargon and overwhelming options. We focus on clarity: what fits best, why it fits, and what to expect long-term."></p>
