<main>
  <h1 data-zh="Materials Notes · 材料判断笔记"
      data-en="Materials Notes · How We Think About Materials"></h1>

  <p data-zh="这不是产品目录，而是我们在实际内装中常用的判断方式。每一条笔记都尽量用生活化语言说明：为什么这样选、要注意什么、长期使用会发生什么。"
     data-en="This is not a product catalogue. These are practical notes on how we evaluate materials in real interior use—why we choose certain options, what to watch for, and what matters long-term."></p>

  <h2 data-zh="笔记列表"
      data-en="Notes List"></h2>

  <div class="note"
       data-zh="（现在先用列表页。以后我们可以加“点进去的详情页”，让每条笔记成为独立文章。）"
       data-en="(This is a list page for now. Later, we can add detail pages so each note becomes a standalone article.)"></div>

  <h2 data-zh="Note 01｜不是所有东西都值得定制"
      data-en="Note 01｜Not Everything Needs to Be Custom"></h2>
  <p data-zh="定制不代表一定要做得更多。有些东西定制后反而更难维护、更难更换。我们会先判断：这是不是一个会长期使用、值得被认真对待的部分。"
     data-en="Custom does not always mean better. Some elements become harder to maintain once customized. We first evaluate whether something is truly worth customizing long-term."></p>

  <h2 data-zh="Note 02｜预算应该花在“每天会用到”的地方"
      data-en="Note 02｜Spend Where You Use, Not Where You See"></h2>
  <p data-zh="预算花在每天都会接触的地方，空间的舒适感会明显不同。有些看起来显眼的地方，其实使用频率很低。"
     data-en="When budget is spent on daily-use areas, comfort improves noticeably. Highly visible elements are not always the most used."></p>

  <h2 data-zh="Note 03｜材料的一致性，会让空间更耐看"
      data-en="Note 03｜Consistency Creates Calm Spaces"></h2>
  <p data-zh="太多材料混在一起，会让空间显得疲惫。一致性比丰富更重要。"
     data-en="Too many materials create visual fatigue. Consistency matters more than variety."></p>

  <h2 data-zh="Note 04｜五金很小，但影响每天的体验"
      data-en="Note 04｜Small Hardware, Big Impact"></h2>
  <p data-zh="五金不显眼，但每天都会碰到。顺不顺手，几年后就知道差别。"
     data-en="Hardware is subtle but used daily. Its quality becomes clear over time."></p>

  <h2 data-zh="Note 05｜有些决定，晚一点做反而更好"
      data-en="Note 05｜Some Decisions Are Better Made Later"></h2>
  <p data-zh="不是所有东西都要一次做完。有些决定，等住进去一段时间再做，反而更准确。"
     data-en="Not everything needs to be decided at once. Living in a space often clarifies choices."></p>

  <h2 data-zh="Note 06｜好不好清洁，比好不好看更重要"
      data-en="Note 06｜Maintenance Matters More Than Looks"></h2>
  <p data-zh="第一眼的好看，不一定代表长期的轻松。我们会提醒客户考虑清洁与维护。"
     data-en="Initial appearance does not guarantee long-term ease. Maintenance should always be considered."></p>

  <h2 data-zh="Note 07｜结构问题，往往不是马上出现"
      data-en="Note 07｜Structural Issues Appear Over Time"></h2>
  <p data-zh="很多问题不是立刻发生，而是慢慢累积。结构与固定方式非常关键。"
     data-en="Many issues develop gradually. Structure and fixing methods matter."></p>

  <h2 data-zh="Note 08｜空间是用来生活的，不是展示的"
      data-en="Note 08｜Spaces Are for Living, Not Display"></h2>
  <p data-zh="我们更关心的是：住进去之后，会不会更轻松。"
     data-en="We focus on how a space feels once lived in—whether daily life becomes easier."></p>
