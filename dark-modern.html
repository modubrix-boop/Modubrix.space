<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dark Modern · ModuBrix.space</title>
  <link rel="stylesheet" href="assets/site.css" />
</head>
<body>
  <div class="container">
    <div class="topbar">
      <a class="brand" href="index.html">
        <div class="brand-badge"></div>
        <div>
          <h1>ModuBrix.space</h1>
          <div class="sub" data-i18n data-zh="返回主页" data-en="Back to home">返回主页</div>
        </div>
      </a>
      <div class="controls">
        <div class="pill">
          <button class="lang-btn active" data-lang="zh">中文</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
        <a class="small-link" href="mailto:modubrix@gmail.com">modubrix@gmail.com</a>
      </div>
    </div>

    <div class="page">
      <div class="panel">
        <div class="cover" style="background-image:url('assets/style-darkmodern.jpg')"></div>
        <div class="content">
          <h2 data-i18n data-zh="Dark Modern｜夜晚才是它的表情" data-en="Dark Modern｜Its true face is at night.">
            Dark Modern｜夜晚才是它的表情
          </h2>
          <p class="lead" data-i18n
             data-zh="强对比、低位光、材质更沉。它不讨好所有人，但会被记住。关键是“可住”，不是“摆拍”。"
             data-en="High contrast, low lighting, heavier materials. Not designed to please everyone — but memorable. The key is livable, not staged.">
            强对比、低位光、材质更沉。它不讨好所有人，但会被记住。关键是“可住”，不是“摆拍”。
          </p>
          <div class="hr"></div>
          <div class="footer">
            <a class="btn" href="index.html" data-i18n data-zh="← 回主页" data-en="← Home">← 回主页</a>
            <span class="meta" data-i18n data-zh="关键词：低位光 / 对比 / 夜晚" data-en="Keywords: low light / contrast / night">
              关键词：低位光 / 对比 / 夜晚
            </span>
          </div>
        </div>
      </div>

      <div class="panel list">
        <h3 data-i18n data-zh="判断细则（客户看得懂版）" data-en="Judgement notes (client-friendly)">判断细则（客户看得懂版）</h3>
        <div class="ul">
          <div class="li">
            <b data-i18n data-zh="低位光，才显得高级" data-en="Low lighting reads premium">低位光，才显得高级</b>
            <span data-i18n data-zh="用壁灯/台灯/灯带制造层次；主灯一开就像办公室。"
                  data-en="Use wall lamps / table lamps / strips for layers; ceiling light makes it office-like.">用壁灯/台灯/灯带制造层次；主灯一开就像办公室。</span>
          </div>
          <div class="li">
            <b data-i18n data-zh="对比要强，但不刺眼" data-en="Strong contrast, not harsh">对比要强，但不刺眼</b>
            <span data-i18n data-zh="深色要靠材质差异拉开，不要靠高饱和颜色。"
                  data-en="Use material difference (not saturation) to create contrast in dark tones.">深色要靠材质差异拉开，不要靠高饱和颜色。</span>
          </div>
          <div class="li">
            <b data-i18n data-zh="留一个“呼吸区”" data-en="Keep a breathing zone">留一个“呼吸区”</b>
            <span data-i18n data-zh="再暗也要留一块干净区域，否则会压得住不下去。"
                  data-en="Even dark rooms need a clean zone — otherwise it feels oppressive.">再暗也要留一块干净区域，否则会压得住不下去。</span>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">
      <div>© <span id="y"></span> ModuBrix.space</div>
      <div data-i18n data-zh="槟城本地｜定制内装｜Consult + Materials" data-en="Penang｜Bespoke interior｜Consult + Materials">
        槟城本地｜定制内装｜Consult + Materials
      </div>
    </div>
  </div>

  <script>document.getElementById("y").textContent = new Date().getFullYear();</script>
  <script src="assets/site.js"></script>
</body>
</html>
