<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Minimalist · ModuBrix.space</title>
  <link rel="stylesheet" href="assets/site.css" />
</head>
<body>
  <div class="container">
    <div class="topbar">
      <a class="brand" href="index.html">
        <div class="brand-badge"></div>
        <div>
          <h1>ModuBrix.space</h1>
          <div class="sub" data-i18n data-zh="返回主页" data-en="Back to home">返回主页</div>
        </div>
      </a>
      <div class="controls">
        <div class="pill">
          <button class="lang-btn active" data-lang="zh">中文</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
        <a class="small-link" href="mailto:modubrix@gmail.com">modubrix@gmail.com</a>
      </div>
    </div>

    <div class="page">
      <div class="panel">
        <div class="cover" style="background-image:url('assets/style-minimalist.jpg')"></div>
        <div class="content">
          <h2 data-i18n data-zh="Minimalist / MUJI｜克制到让材料说话" data-en="Minimalist / MUJI｜Restraint lets materials speak.">
            Minimalist / MUJI｜克制到让材料说话
          </h2>
          <p class="lead" data-i18n
             data-zh="这不是“空”，而是“收得很干净”。它适合长期住：低反光、少噪音、把能变的东西都藏好。"
             data-en="Not 'empty' — but intentionally cleaned. Built for long-term living: low glare, low noise, flexible items stored away.">
            这不是“空”，而是“收得很干净”。它适合长期住：低反光、少噪音、把能变的东西都藏好。
          </p>
          <div class="hr"></div>
          <div class="footer">
            <a class="btn" href="index.html" data-i18n data-zh="← 回主页" data-en="← Home">← 回主页</a>
            <span class="meta" data-i18n data-zh="关键词：留白 / 哑光 / 低噪音" data-en="Keywords: white space / matte / low-noise">
              关键词：留白 / 哑光 / 低噪音
            </span>
          </div>
        </div>
      </div>

      <div class="panel list">
        <h3 data-i18n data-zh="判断细则（客户看得懂版）" data-en="Judgement notes (client-friendly)">判断细则（客户看得懂版）</h3>
        <div class="ul">
          <div class="li">
            <b data-i18n data-zh="反光越少，越不累" data-en="Less glare = less fatigue">反光越少，越不累</b>
            <span data-i18n data-zh="优先哑光/半哑光表面；亮面只做小面积点缀。" data-en="Prefer matte/semi-matte finishes; glossy only as tiny accents.">优先哑光/半哑光表面；亮面只做小面积点缀。</span>
          </div>
          <div class="li">
            <b data-i18n data-zh="收纳先于装饰" data-en="Storage before decoration">收纳先于装饰</b>
            <span data-i18n data-zh="你可以慢慢变风格，但收纳逻辑必须一开始就做对。" data-en="You can change style later, but storage logic must be right from day one.">你可以慢慢变风格，但收纳逻辑必须一开始就做对。</span>
          </div>
          <div class="li">
            <b data-i18n data-zh="少分割 = 少出错" data-en="Fewer splits = fewer mistakes">少分割 = 少出错</b>
            <span data-i18n data-zh="线条少一点，接口少一点，后期维修和清洁都会轻松很多。" data-en="Fewer lines and joints means easier cleaning and lower maintenance.">线条少一点，接口少一点，后期维修和清洁都会轻松很多。</span>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">
      <div>© <span id="y"></span> ModuBrix.space</div>
      <div data-i18n data-zh="槟城本地｜定制内装｜Consult + Materials" data-en="Penang｜Bespoke interior｜Consult + Materials">
        槟城本地｜定制内装｜Consult + Materials
      </div>
    </div>
  </div>

  <script>document.getElementById("y").textContent = new Date().getFullYear();</script>
  <script src="assets/site.js"></script>
</body>
</html>
