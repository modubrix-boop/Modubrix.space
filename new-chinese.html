<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>New Chinese · ModuBrix.space</title>
  <link rel="stylesheet" href="assets/site.css" />
</head>
<body>
  <div class="container">
    <div class="topbar">
      <a class="brand" href="index.html">
        <div class="brand-badge"></div>
        <div>
          <h1>ModuBrix.space</h1>
          <div class="sub" data-i18n data-zh="返回主页" data-en="Back to home">返回主页</div>
        </div>
      </a>
      <div class="controls">
        <div class="pill">
          <button class="lang-btn active" data-lang="zh">中文</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
        <a class="small-link" href="mailto:modubrix@gmail.com">modubrix@gmail.com</a>
      </div>
    </div>

    <div class="page">
      <div class="panel">
        <div class="cover" style="background-image:url('assets/style-newchinese.jpg')"></div>
        <div class="content">
          <h2 data-i18n data-zh="New Chinese｜留，而不是空" data-en="New Chinese｜Keep, not empty.">
            New Chinese｜留，而不是空
          </h2>
          <p class="lead" data-i18n
             data-zh="新中式的关键不是 Zen，而是“收与留”：有重量、有重心、有留白，但不轻飘。它更像一种气质的节制。"
             data-en="New Chinese is not Zen. It’s restraint and keeping: weight, a clear center, and white space — without feeling light or empty.">
            新中式的关键不是 Zen，而是“收与留”：有重量、有重心、有留白，但不轻飘。它更像一种气质的节制。
          </p>
          <div class="hr"></div>
          <div class="footer">
            <a class="btn" href="index.html" data-i18n data-zh="← 回主页" data-en="← Home">← 回主页</a>
            <span class="meta" data-i18n data-zh="关键词：深木 / 留白 / 重心" data-en="Keywords: deep wood / white space / center">
              关键词：深木 / 留白 / 重心
            </span>
          </div>
        </div>
      </div>

      <div class="panel list">
        <h3 data-i18n data-zh="判断细则（客户看得懂版）" data-en="Judgement notes (client-friendly)">判断细则（客户看得懂版）</h3>
        <div class="ul">
          <div class="li">
            <b data-i18n data-zh="要“重”，不要“轻”" data-en="Go weighted, not light">要“重”，不要“轻”</b>
            <span data-i18n data-zh="深木/深灰建立重量感；太白太浅容易被看成日式。"
                  data-en="Use deep wood/charcoal to create weight; too white/light reads as Japanese.">深木/深灰建立重量感；太白太浅容易被看成日式。</span>
          </div>
          <div class="li">
            <b data-i18n data-zh="不必完全对称" data-en="Not strictly symmetrical">不必完全对称</b>
            <span data-i18n data-zh="中国语境的克制更像“留”，不是一刀切的空。"
                  data-en="Chinese restraint is about keeping — not emptying everything.">中国语境的克制更像“留”，不是一刀切的空。</span>
          </div>
          <div class="li">
            <b data-i18n data-zh="线条要节制但不断" data-en="Restrained but continuous lines">线条要节制但不断</b>
            <span data-i18n data-zh="该有的边界要清楚：收边、踢脚、柜体留缝要统一。"
                  data-en="Boundaries must be clear: edging, skirting, cabinet reveals should be consistent.">该有的边界要清楚：收边、踢脚、柜体留缝要统一。</span>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">
      <div>© <span id="y"></span> ModuBrix.space</div>
      <div data-i18n data-zh="槟城本地｜定制内装｜Consult + Materials" data-en="Penang｜Bespoke interior｜Consult + Materials">
        槟城本地｜定制内装｜Consult + Materials
      </div>
    </div>
  </div>

  <script>document.getElementById("y").textContent = new Date().getFullYear();</script>
  <script src="assets/site.js"></script>
</body>
</html>
