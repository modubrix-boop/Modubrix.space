<main>
  <h1 data-zh="关于 ModuBrix"
      data-en="About ModuBrix"></h1>

  <p data-zh="ModuBrix 是一家位于槟城的小型定制内装顾问工作室。我们不是设计事务所，也不是流水线式的装修公司。我们更像是站在“判断与落地之间”的人：既关注空间的使用方式，也尊重材料与现场的现实条件。"
     data-en="ModuBrix is a small, Penang-based interior fit-out consultancy. We are not a design studio, and not a mass-production renovation contractor. We operate between judgment and execution—focused on usability while respecting real-world site and material constraints."></p>

  <div class="note"
       data-zh="我们不以赶工为目标。我们更在意空间完成后，是否真的舒服、耐用、少后悔。"
       data-en="We don’t aim to rush. We care whether a finished space is comfortable, durable, and leads to fewer regrets."></div>

  <h2 data-zh="为什么我们选择这样做"
      data-en="Why We Work This Way"></h2>

  <p data-zh="我们越来越清楚一件事：真正让人后悔的，往往不是“做得不够多”，而是“当初没有想清楚”。很多内装问题不是马上出现，而是住进去之后每天一点一点地累积：不好清洁、用起来别扭、动线不顺、柜子不实用、细节开始松动。"
     data-en="We learned that most regrets do not come from doing too little, but from not thinking decisions through. Many problems appear slowly after moving in: hard-to-clean surfaces, awkward daily use, poor flow, impractical storage, and small details that loosen over time."></p>

  <p data-zh="所以我们更愿意把时间花在前面：把需求问清楚、把选择理顺、把材料用对。定制需要时间，我们宁愿慢一点，也要把事情做对。"
     data-en="That’s why we invest time upfront: clarifying needs, simplifying choices, and using materials appropriately. Custom work takes time—we would rather slow down and do it right."></p>

  <h2 data-zh="我们不是设计师，这并不是缺点"
      data-en="We Are Not Designers—and That’s Not a Weakness"></h2>

  <p data-zh="我们不会用很多复杂的专业名词，也不靠华丽的图去说服你。我们更习惯用真实的方式讨论空间：你怎么用？会不会每天碰到？好不好清洁？以后要不要维修？这些问题，往往比“看起来很高级”更重要。"
     data-en="We don’t rely on heavy jargon or glossy visuals to convince you. We prefer real questions: How will you use it daily? Will it be easy to clean? What happens when repairs are needed? These often matter more than looking impressive."></p>

  <p data-zh="我们在意成就感——这种成就感不是来自完成得有多快，而来自项目结束后回头看，仍然觉得：这个空间被认真对待过。"
     data-en="We care about a sense of completion. Not from speed, but from being able to look back and feel the space was handled with genuine care."></p>

  <h2 data-zh="我们的定位：Consult × Materials × Execution"
      data-en="Our Positioning: Consult × Materials × Execution"></h2>

  <p data-zh="Consult：在关键节点帮你做判断，减少后悔。"
     data-en="Consult: helping you make decisions at key points to reduce regret."></p>

  <p data-zh="Materials：材料不是越多越好。我们从使用、维护与一致性出发，协助你做更适合长期使用的选择。"
     data-en="Materials: more is not always better. We focus on usability, maintenance, and consistency for long-term comfort."></p>

  <p data-zh="Execution：我们不只是给建议。需要时我们会协助跟进与协调关键节点，让事情完成得更踏实。"
     data-en="Execution: not just advice. Where needed, we help follow through and coordinate key points so outcomes feel solid."></p>

  <div class="note"
       data-zh="如果你正在寻找一个愿意听你说、愿意慢慢把空间想清楚、并愿意把事情做完的人，我们可能适合你。"
       data-en="If you want someone who listens, thinks carefully with you, and helps carry things through to completion, we may be a good match."></div>
