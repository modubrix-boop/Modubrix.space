  <h1 data-zh="Note 03｜材料一致性，会让空间更耐看"
      data-en="Note 03｜Consistency Creates Calm Spaces"></h1>

  <p data-zh="很多空间看起来“累”，不是因为不够高级，而是因为材料太多、语气太杂。"
     data-en="Many spaces feel visually tiring not because they lack luxury, but because there are too many materials competing at once."></p>

  <h2 data-zh="我们为什么重视一致性"
      data-en="Why We Value Consistency"></h2>

  <p data-zh="一致性会带来一种“稳”。当材料数量被控制、质感被协调，空间就更耐看，也更不容易后悔。"
     data-en="Consistency creates calm. When material variety is controlled and textures are coordinated, spaces feel more timeless and less regret-prone."></p>

  <h2 data-zh="我们通常怎么做"
      data-en="How We Usually Apply It"></h2>

  <p data-zh="• 控制材料数量（少一点，但更准）"
     data-en="• Limit material variety (less, but more intentional)"></p>

  <p data-zh="• 让表面质感彼此协调（光泽、纹理、颜色方向一致）"
     data-en="• Align textures (gloss, grain, tone direction)"></p>

  <p data-zh="• 把“强调点”留给真正重要的地方"
     data-en="• Reserve emphasis for what truly matters"></p>

  <div class="note"
       data-zh="空间不需要被填满，空间更需要被想清楚。"
       data-en="A space doesn’t need to be filled. It needs to be thought through."></div>
