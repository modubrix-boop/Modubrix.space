  <h1 data-zh="Note 01｜不是所有东西都值得定制"
      data-en="Note 01｜Not Everything Needs to Be Custom"></h1>

  <p data-zh="很多人一开始会觉得：既然做内装，那就尽量定制、尽量做满。但现实是，定制不等于更好。"
     data-en="Many people assume that fit-out means customizing everything. In reality, custom does not automatically mean better."></p>

  <h2 data-zh="我们为什么会提醒这件事"
      data-en="Why We Raise This Point"></h2>

  <p data-zh="因为定制一旦做下去，未来要调整、维修、替换，成本通常更高，弹性也更小。尤其是使用频率低、或需求可能改变的部分，做得太死反而不舒服。"
     data-en="Once something is customized, future adjustments, repairs, or replacements often become more costly and less flexible—especially for low-use areas or elements that may change with lifestyle."></p>

  <h2 data-zh="我们通常怎么判断"
      data-en="How We Usually Evaluate"></h2>

  <p data-zh="我们会先问几个很简单的问题："
     data-en="We start with a few simple questions:"></p>

  <p data-zh="• 这个东西你会不会每天用？用的频率有多高？"
     data-en="• Will you use this daily? How frequent is the use?"></p>

  <p data-zh="• 如果未来要换，你希望“好换”还是“很麻烦也无所谓”？"
     data-en="• If you need to replace it later, do you want it to be easy—or are you fine with hassle?"></p>

  <p data-zh="• 这个决定做下去，会不会影响空间的舒服感？"
     data-en="• Will this choice improve comfort—or create clutter and inconvenience?"></p>

  <div class="note"
       data-zh="定制最值得放进去的地方，通常是“会长期使用、值得被认真对待”的部分。"
       data-en="The best place for custom work is usually where it will be used long-term and truly deserves careful attention."></div>
