  <h1 data-zh="Note 02｜预算应该花在“每天会用到”的地方"
      data-en="Note 02｜Spend Where You Use, Not Where You See"></h1>

  <p data-zh="预算有限是常态，关键是花在哪里。空间的舒适感，往往来自每天会用到的细节，而不是一次性好看的画面。"
     data-en="Budget limits are normal. The question is where to spend it. Comfort often comes from daily-use details, not one-time visual impact."></p>

  <h2 data-zh="我们会怎么帮你取舍"
      data-en="How We Help You Prioritize"></h2>

  <p data-zh="我们通常会把选择拆成两类："
     data-en="We often split decisions into two categories:"></p>

  <p data-zh="• 高频使用：每天会碰、会开合、会清洁的地方"
     data-en="• High-frequency use: touched, opened, cleaned daily"></p>

  <p data-zh="• 低频出现：偶尔看到、几乎不互动的地方"
     data-en="• Low-frequency exposure: rarely interacted with"></p>

  <p data-zh="同样的钱，花在高频使用区，长期体感差别会非常明显。"
     data-en="Spending on high-frequency areas makes a much bigger long-term difference."></p>

  <div class="note"
       data-zh="简单原则：预算优先保证“每天用得顺”，再考虑“看起来更高级”。"
       data-en="Simple rule: make daily use smooth first—then improve appearance if budget allows."></div>
