<main>
  <h1 data-zh="Materials · 材料整合与构成"
      data-en="Materials · Integration & Components"></h1>

  <p data-zh="在定制内装中，材料不是独立存在的“产品”，而是空间体验的一部分。"
     data-en="In custom interiors, materials are not standalone products—they shape the overall experience of a space."></p>

  <p data-zh="我们不追求材料越多越好，也不追逐短期流行。我们更在意的是：用起来是否顺、维护是否现实、整体是否一致、日后是否容易调整。"
     data-en="We don’t aim to use more materials or chase short-lived trends. We focus on usability, practical maintenance, consistency, and future flexibility."></p>

  <div class="note"
       data-zh="我们的工作不是推销材料，而是帮你减少选择混乱，把材料用在真正合适的地方。"
       data-en="Our role is not to sell materials, but to simplify choices and use materials where they truly make sense."></div>

  <h2 data-zh="我们常关注的三个方向"
      data-en="Three Areas We Commonly Focus On"></h2>

  <p data-zh="1) 柜体与收纳构成：结构稳定、内部逻辑、长期使用后的状态。"
     data-en="1) Cabinetry & storage structures: stability, internal usability, and long-term performance."></p>

  <p data-zh="2) 五金与功能配件：顺不顺手、耐不耐用、维修是否方便。"
     data-en="2) Hardware & functional components: ease of use, durability, and maintenance convenience."></p>

  <p data-zh="3) 表面材料与饰面：好不好清洁、是否耐看、与空间一致性。"
     data-en="3) Surface materials & finishes: cleanability, longevity, and visual consistency."></p>

  <p data-zh="你可以在 Materials Notes 里看到我们更具体的判断笔记。"
     data-en="For more detailed thinking, see our Materials Notes."></p>
